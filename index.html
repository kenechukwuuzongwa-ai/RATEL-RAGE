<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <meta name="description" content="RATEL RAGE: The Street Tax. A 2D arcade beat-'em-up on the streets of Lagos." />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>RATEL RAGE — The Street Tax</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell" aria-label="RATEL RAGE game">
    <canvas id="game" width="1280" height="720" tabindex="0" aria-label="RATEL RAGE arcade game canvas"></canvas>
    <div id="loading" class="loading">PREPARING THE STREETS…</div>
  </main>
  <div id="rotate-hint" class="rotate-hint" aria-hidden="true">TURN YOUR PHONE SIDEWAYS TO PLAY</div>
  <noscript>This game requires JavaScript.</noscript>
  <!-- Optional analytics: off unless analytics-config.js names an endpoint
       (or supabase-config.js names a project). -->
  <script src="supabase-config.js?v=ratelrage-mobile-v80"></script>
  <script src="analytics-config.js?v=ratelrage-mobile-v80"></script>
  <!-- Billboard ads: off unless ads-config.js names the rr-ads Worker (docs/ADS.md). -->
  <script src="ads-config.js?v=ratelrage-mobile-v80"></script>
  <script src="frontend/vendor/qrcode/qrcode.js?v=ratelrage-mobile-v80"></script>
  <script src="src/analytics.js?v=ratelrage-mobile-v80"></script>
  <!-- Progress: local first; account sync is off unless supabase-config.js names a project. -->
  <script src="src/progress.js?v=ratelrage-mobile-v80"></script>
  <script src="src/account.js?v=ratelrage-mobile-v80"></script>
  <script src="src/webshell.js?v=ratelrage-mobile-v80"></script>
  <script src="src/touch.js?v=ratelrage-mobile-v80"></script>
  <script type="module" src="src/game.js?v=ratelrage-mobile-v80"></script>
</body>
</html>
