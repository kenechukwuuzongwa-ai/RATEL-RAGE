<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>drive test</title>
  <link rel="stylesheet" href="../styles.css" />
  <script>window.__rorNoPanel = true;</script>
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
    <div id="loading" class="loading">LOADING…</div>
  </main>
  <pre id="log" style="position:fixed;top:0;right:0;color:#0f0;background:#000;z-index:9;margin:0"></pre>
  <script type="module" src="../src/game.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const log = document.getElementById('log');
    // Deterministic sim: hold right for 2s, jump, run 1s more, release, 1s idle.
    addEventListener('load', () => {
      setTimeout(() => {
        const s = window.__ror;
        if (!s) { log.textContent = 'no hook'; return; }
        const DT = 1 / 60;
        if (p.has('overlap')) { // two enemies crowding one spot must separate
          const a = s.enemies[0], b = s.enemies[1];
          a.state = b.state = 'walk'; a.role = b.role = 'front';
          s.player.x = 3000; s.player.y = 650;
          a.x = 3200; a.y = 650; b.x = 3205; b.y = 652;   // nearly stacked
          for (let i = 0; i < 90; i++) s.step(DT);
          const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
          const overlapping = dx < s.tune.laneGapX && dy < s.tune.laneGapY;
          log.textContent = `overlap: dx=${dx.toFixed(0)} dy=${dy.toFixed(0)} `
            + `gap=${s.tune.laneGapX}/${s.tune.laneGapY} overlapping=${overlapping}`;
          return;
        }
        if (p.has('enemywatch')) { // observe enemy anim/facing while patrolling and approached
          const e = s.enemies[0];
          const snapE = (tag) => log.textContent +=
            `${tag}: state=${e.state} anim=${e.anim} frame=${e.frame} facing=${e.facing} dir=${e.direction} x=${e.x.toFixed(0)}\n`;
          for (let i = 0; i < 20; i++) s.step(DT); snapE('t20');
          for (let i = 0; i < 20; i++) s.step(DT); snapE('t40');
          for (let i = 0; i < 20; i++) s.step(DT); snapE('t60');
          s.player.x = e.x - 120; s.player.y = e.y;      // step into guard range
          for (let i = 0; i < 10; i++) s.step(DT); snapE('near10');
          for (let i = 0; i < 20; i++) s.step(DT); snapE('near30');
          return;
        }
        if (p.has('jumpshot')) { // walk, jump, freeze mid-air
          dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyD' }));
          for (let i = 0; i < 60; i++) s.step(DT);
          dispatchEvent(new KeyboardEvent('keydown', { code: 'Space' }));
          const n = Number(p.get('jumpshot')) || 20;
          for (let i = 0; i < n; i++) s.step(DT);
          log.textContent = `jumpshot: anim=${s.player.anim} frame=${s.player.frame} grounded=${s.player.grounded}`;
          return;
        }
        if (p.has('walkshot')) { // stop mid-stride for a visual check
          dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyD' }));
          const n = Number(p.get('walkshot')) || 100;
          for (let i = 0; i < n; i++) s.step(DT);
          log.textContent = `walkshot: anim=${s.player.anim} frame=${s.player.frame}`;
          return;
        }
        const snap = (tag) =>
          log.textContent += `${tag}: x=${s.player.x.toFixed(0)} y=${s.player.y.toFixed(0)} vx=${s.player.vx.toFixed(0)} vy=${s.player.vy.toFixed(0)} cam=${s.cameraX.toFixed(0)} anim=${s.player.anim} frame=${s.player.frame} grounded=${s.player.grounded} facing=${s.player.facing}\n`;
        snap('start');
        dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyD' }));
        for (let i = 0; i < 120; i++) s.step(DT);
        snap('walk2s');
        dispatchEvent(new KeyboardEvent('keydown', { code: 'Space' }));
        for (let i = 0; i < 15; i++) s.step(DT);
        snap('air.25s');
        for (let i = 0; i < 45; i++) s.step(DT);
        snap('land1s');
        dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyD' }));
        dispatchEvent(new KeyboardEvent('keyup', { code: 'Space' }));
        for (let i = 0; i < 60; i++) s.step(DT);
        snap('idle1s');
        const us = s.sprites.uppercutSprite;
        const hb11 = us.hits.get(11)[0];
        log.textContent += `upc: drawW=${us.drawW} drawH=${us.drawH} anchor11=${us.anchors[11].toFixed(0)} hb11=${hb11.x.toFixed(0)},${hb11.y.toFixed(0)} ${hb11.w.toFixed(0)}x${hb11.h.toFixed(0)}\n`;
        // Uppercut: teleport into range of enemy 0 (same lane), swing, verify.
        window.__ror.debugHitboxes = true;
        const e = s.enemies[0];
        const esnap = (tag) =>
          log.textContent += `${tag}: enemy0 state=${e.state} x=${e.x.toFixed(0)} jumpY=${e.jumpY.toFixed(0)}\n`;
        s.player.x = e.x - 110; s.player.y = e.y; s.player.vx = 0; s.player.facing = 1;
        dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyJ' }));
        for (let i = 0; i < 22; i++) s.step(DT);   // ~frame 11, strike active
        snap('atk.37s'); esnap('atk.37s');
        for (let i = 0; i < 38; i++) s.step(DT);   // 1s total: attack over, enemy landed
        snap('atk1s'); esnap('atk1s');
        for (let i = 0; i < 100; i++) s.step(DT);  // down timer expires
        esnap('atk2.6s');
        dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyJ' }));
        // Leave the sim mid-strike on enemy 1 so the screenshot shows the
        // uppercut pose, debug hitbox, and the enemy reacting.
        const e1 = s.enemies[1];
        s.player.x = e1.x - 100; s.player.y = e1.y; s.player.vx = 0; s.player.facing = 1;
        // this swing comes from the left mouse button
        document.getElementById('game')
          .dispatchEvent(new MouseEvent('mousedown', { button: 0 }));
        for (let i = 0; i < 26; i++) s.step(DT);
        snap('atk2.43s'); log.textContent += `enemy1: state=${e1.state} jumpY=${e1.jumpY.toFixed(0)}\n`;
      }, 800);
    });
  </script>
</body>
</html>
