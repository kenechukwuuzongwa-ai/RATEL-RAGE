<!doctype html>
<!-- Grid overlay for reading crop coords: ?src=../level1/assetkit.png&grid=64 -->
<html><body style="margin:0;background:#111">
<canvas id="c"></canvas>
<script>
  const p = new URLSearchParams(location.search);
  const src = p.get('src');
  const grid = +(p.get('grid') || 128);
  const cx = +(p.get('cx') || 0), cy = +(p.get('cy') || 0);
  const cw = +(p.get('cw') || 0), ch = +(p.get('ch') || 0);
  const zoom = +(p.get('zoom') || 1);
  const img = new Image();
  img.onload = () => {
    const c = document.getElementById('c');
    const rw = cw || img.width, rh = ch || img.height;
    c.width = rw * zoom; c.height = rh * zoom;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(img, cx, cy, rw, rh, 0, 0, rw * zoom, rh * zoom);
    x.translate(-cx * zoom, -cy * zoom);
    x.scale(zoom, zoom);
    x.strokeStyle = 'rgba(0,255,120,.35)';
    x.fillStyle = '#0f0';
    x.font = '11px monospace';
    x.lineWidth = 1;
    for (let gx = 0; gx <= img.width; gx += grid) {
      x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, img.height); x.stroke();
      for (let gy = grid; gy <= img.height; gy += grid) x.fillText(`${gx},${gy}`, gx + 2, gy - 2);
    }
    for (let gy = 0; gy <= img.height; gy += grid) {
      x.beginPath(); x.moveTo(0, gy); x.lineTo(img.width, gy); x.stroke();
    }
  };
  img.src = src;
</script>
</body></html>
